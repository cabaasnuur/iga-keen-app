<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGA KEEN | Goldogob</title>

<style>
:root {
  --black: #000000;
  --white: #ffffff;
  --gray-light: #f5f5f7;
  --gray-border: #e0e0e0;
  --gray-text: #666666;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background: var(--white);
  color: var(--black);
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
header {
  border-bottom: 1px solid var(--gray-border);
  padding: 20px;
  background: var(--white);
}

.header-inner {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

.sub-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gray-text);
}

.city-tag {
  font-size: 11px;
  font-weight: 600;
  border: 1px solid var(--black);
  padding: 4px 10px;
  border-radius: 4px;
}

/* Main Container */
main {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px;
  flex: 1;
}

/* Service Selector Tabs */
.service-tabs {
  display: flex;
  background: var(--gray-light);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 24px;
}

.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 12px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-text);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab-btn.active {
  background: var(--black);
  color: var(--white);
}

/* Banner Box */
.info-card {
  border: 1px solid var(--black);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 24px;
}

.info-card h2 {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 4px;
}

.info-card p {
  font-size: 13px;
  color: var(--gray-text);
}

/* Form Styling */
.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--gray-border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--white);
  color: var(--black);
  outline: none;
  transition: border-color 0.2s;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--black);
}

.btn-gps {
  width: 100%;
  background: var(--white);
  color: var(--black);
  border: 1px dashed var(--black);
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.2s;
}

.btn-gps:hover {
  background: var(--gray-light);
}

#gpsStatus {
  font-size: 12px;
  color: var(--gray-text);
  margin-top: 6px;
}

.btn-submit {
  width: 100%;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 16px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}

.btn-submit:active {
  opacity: 0.9;
}

/* Footer */
footer {
  border-top: 1px solid var(--gray-border);
  padding: 24px 20px;
  text-align: center;
  font-size: 12px;
  color: var(--gray-text);
  margin-top: auto;
}

footer strong {
  color: var(--black);
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo-title">IGA KEEN</div>
      <div class="sub-title">Adeeg Degdeg Ah</div>
    </div>
    <div class="city-tag">GOLDOGOB</div>
  </div>
</header>

<main>

  <!-- Service Selection Tabs -->
  <div class="service-tabs">
    <button class="tab-btn active" onclick="selectService(this, 'Taxi')">Taxi</button>
    <button class="tab-btn" onclick="selectService(this, 'Delivery')">Delivery</button>
    <button class="tab-btn" onclick="selectService(this, 'Safar')">Safar</button>
  </div>

  <!-- Info Card -->
  <div class="info-card">
    <h2 id="serviceHeading">Adeegga Taxi-ga</h2>
    <p id="serviceDesc">Puntland - Ka hel gaari kuu dhow meel kasta oo aad joogto.</p>
  </div>

  <!-- Form -->
  <form id="orderForm" onsubmit="submitForm(event)">

    <div class="form-group">
      <label for="name">Magacaaga</label>
      <input type="text" id="name" placeholder="Geli magacaaga" required>
    </div>

    <div class="form-group">
      <label for="phone">Lambarka Telefoonka</label>
      <input type="tel" id="phone" placeholder="Tusaale: 0907825640" required>
    </div>

    <div class="form-group">
      <label for="pickup">Meesha Lagaa Qaadayo</label>
      <input type="text" id="pickup" placeholder="Tusaale: Suuqa dhexe" required>
      <button type="button" class="btn-gps" onclick="fetchGPS()">📍 Soo Dir GPS Location-kayga</button>
      <div id="gpsStatus">Location lama helin (Optional)</div>
    </div>

    <div class="form-group">
      <label for="destination">Meesha Aad U Socoto / Ku Aadeysid</label>
      <input type="text" id="destination" placeholder="Geli meesha u socoto" required>
    </div>

    <div class="form-group">
      <label for="time">Waqtiga</label>
      <select id="time" required>
        <option value="Hadda">Hadda (Degdeg)</option>
        <option value="30 daqiiqo gudahood">30 daqiiqo gudahood</option>
        <option value="Waqti dambe">Waqti dambe</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Faahfaahin Dheeraad Ah</label>
      <textarea id="notes" rows="2" placeholder="Sida alaabta aad rabto ama faahfaahin kale"></textarea>
    </div>

    <button type="submit" class="btn-submit">DALABKA U DIR WHATSAPP</button>

  </form>

</main>

<footer>
  <p><strong>IGA KEEN</strong> — Goldogob, Soomaaliya</p>
  <p style="margin-top: 4px;">© 2026 Xaqdoorka waa la dhowray.</p>
</footer>

<script>
const WHATSAPP_NUMBER = "252907825640";
let selectedService = "Taxi";
let userGPS = "";

const serviceData = {
  "Taxi": "Ka hel gaari kuu dhow meel kasta oo aad joogto Goldogob.",
  "Delivery": "Alaab ama cunto ka dalbo meel kasta naga soo gaarsiin doona.",
  "Safar": "Boos ka qabso gawaarida u socda magaalooyinka kale."
};

function selectService(element, serviceName) {
  // Update Tab active state
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');

  // Update headers
  selectedService = serviceName;
  document.getElementById('serviceHeading').textContent = `Adeegga ${serviceName}`;
  document.getElementById('serviceDesc').textContent = serviceData[serviceName];
}

function fetchGPS() {
  const status = document.getElementById('gpsStatus');
  if (!navigator.geolocation) {
    status.textContent = "GPS-ka ma taageerayo telefoonkaaga.";
    return;
  }
  status.textContent = "Location-ka waa la raadinayaa...";
  
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userGPS = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
      status.textContent = "✅ Location-ka waa la helay!";
    },
    () => {
      status.textContent = "❌ Waalaga helay Location-ka.";
    }
  );
}

function submitForm(e) {
  e.preventDefault();

  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const pickup = document.getElementById('pickup').value;
  const destination = document.getElementById('destination').value;
  const time = document.getElementById('time').value;
  const notes = document.getElementById('notes').value;

  let msg = `*DALAB CUSUB: ${selectedService.toUpperCase()}*\n\n`;
  msg += `👤 *Magaca:* ${name}\n`;
  msg += `📞 *Lambar:* ${phone}\n`;
  msg += `📍 *Laga qaadayo:* ${pickup}\n`;
  msg += `🎯 *U socdaa:* ${destination}\n`;
  msg += `⏰ *Waqtiga:* ${time}\n`;
  
  if (userGPS) {
    msg += `🌐 *Location:* ${userGPS}\n`;
  }
  if (notes) {
    msg += `📝 *Faahfaahin:* ${notes}\n`;
  }

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
