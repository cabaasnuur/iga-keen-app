<section class="view" id="auth-view">
  <button class="back-button" id="auth-back" type="button">
    ← Dib u noqo
  </button>

  <div class="page-heading">
    <span class="overline">AKOONKAAGA</span>
    <h1 id="auth-title">Ku soo gal IGA KEEN</h1>
    <p id="auth-description">
      Gal akoonkaaga si aad adeeg u dalbato.
    </p>
  </div>

  <form id="auth-form" class="form-card">
    <div id="signup-fields" hidden>
      <label class="label" for="auth-name">Magacaaga</label>
      <input
        id="auth-name"
        type="text"
        autocomplete="name"
        maxlength="100"
        placeholder="Magaca oo buuxa"
      >

      <label class="label" for="auth-phone">Telefoonka</label>
      <input
        id="auth-phone"
        type="tel"
        autocomplete="tel"
        maxlength="30"
        placeholder="061xxxxxxx"
      >
    </div>

    <label class="label" for="auth-email">Gmail / Email</label>
    <input
      id="auth-email"
      type="email"
      autocomplete="email"
      placeholder="magaca@gmail.com"
      required
    >

    <label class="label" for="auth-password">Password</label>
    <input
      id="auth-password"
      type="password"
      autocomplete="current-password"
      minlength="8"
      placeholder="Ugu yaraan 8 xaraf"
      required
    >

    <button
      class="primary-button submit-button"
      id="auth-submit"
      type="submit"
    >
      Ku soo gal
    </button>

    <button
      class="secondary-button auth-switch"
      id="auth-switch"
      type="button"
    >
      Akoon cusub samee
    </button>

    <button
      class="auth-forgot"
      id="forgot-password"
      type="button"
    >
      Password-ka ma illowday?
    </button>

    <div
      class="feedback"
      id="auth-feedback"
      role="status"
      aria-live="polite"
    ></div>
  </form>

  <div class="contact-card auth-account" id="account-card" hidden>
    <span class="contact-symbol">✓</span>
    <h2>Waad soo gashay</h2>
    <p id="account-email"></p>
    <button class="secondary-button" id="auth-logout" type="button">
      Ka bax akoonka
    </button>
  </div>
</section>
