<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGA KEEN - Local Transportation and Delivery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
        }
        .container {
            padding: 20px;
        }
        .service-card {
            border: 1px solid #000000;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
        }
        .service-card i {
            font-size: 50px;
            margin-bottom: 10px;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #444444;
        }
        .order-form {
            display: none;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #000000;
            color: #ffffff;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <header>
        <h1>IGA KEEN</h1>
        <p>Local Transportation and Delivery Service</p>
    </header>
    <div class="container">
        <div class="service-card">
            <i class="fas fa-motorcycle"></i>
            <h2>Bajaaj</h2>
            <button onclick="openOrderForm('Bajaaj')">Dalbo Hadda</button>
        </div>
        <div class="service-card">
            <i class="fas fa-taxi"></i>
            <h2>Taxi</h2>
            <button onclick="openOrderForm('Taxi')">Dalbo Hadda</button>
        </div>
        <div class="service-card">
            <i class="fas fa-box"></i>
            <h2>Delivery</h2>
            <button onclick="openOrderForm('Delivery')">Dalbo Hadda</button>
        </div>
        <div class="service-card">
            <i class="fas fa-bus"></i>
            <h2>Safar</h2>
            <button onclick="openOrderForm('Safar')">Dalbo Hadda</button>
        </div>

        <div class="order-form" id="orderForm">
            <h3>Order Form</h3>
            <div class="form-group">
                <label for="customerName">Customer Name:</label>
                <input type="text" id="customerName" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" required>
            </div>
            <div class="form-group">
                <label for="pickupLocation">Pickup Location:</label>
                <input type="text" id="pickupLocation" required>
            </div>
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" required>
            </div>
            <button onclick="getLocation()">Isticmaal Goobtayda</button>
            <div id="coordinates"></div>
            <div class="form-group">
                <label for="additionalInstructions">Additional Instructions:</label>
                <textarea id="additionalInstructions"></textarea>
            </div>
            <button onclick="submitOrder()">Submit Order</button>
            <div id="message"></div>
        </div>
    </div>
    <footer>
        <p>IGA KEEN — Goldogob, Somalia</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://zywwypqddnvslgqztnep.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fDRyejheqSBrLQcBe8KpQw_L76yFtp8";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function openOrderForm(service) {
            document.getElementById('orderForm').style.display = 'block';
            // Additional logic for service-specific fields can be added here
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById('coordinates').innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('coordinates').innerHTML = `Latitude: ${lat}, Longitude: ${lon}`;
            // Save coordinates logic can be added here
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    document.getElementById('coordinates').innerHTML = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    document.getElementById('coordinates').innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    document.getElementById('coordinates').innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    document.getElementById('coordinates').innerHTML = "An unknown error occurred.";
                    break;
            }
        }

        async function submitOrder() {
            const customerName = document.getElementById('customerName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const pickupLocation = document.getElementById('pickupLocation').value;
            const destination = document.getElementById('destination').value;
            const additionalInstructions = document.getElementById('additionalInstructions').value;

            if (!customerName || !phoneNumber || !pickupLocation || !destination) {
                document.getElementById('message').innerHTML = "Please fill in all required fields.";
                return;
            }

            document.getElementById('message').innerHTML = "Submitting...";
            const { data, error } = await db
                .from('orders')
                .insert([{ customer_name: customerName, phone_number: phoneNumber, pickup_location: pickupLocation, destination: destination, additional_instructions: additionalInstructions }]);

            if (error) {
                console.error(error);
                document.getElementById('message').innerHTML = "Waan ka xunnahay! Dalabkaaga hadda lama gudbin. Fadlan mar kale isku day wax yar kadib.";
            } else {
                document.getElementById('message').innerHTML = "Waad ku mahadsan tahay inaad dooratay IGA KEEN. Dalabkaaga si guul leh ayaa loo gudbiyey. Waxaan kula soo xiriiri doonnaa lambarka aad bixisay.";
            }
        }
    </script>
</body>
</html>
