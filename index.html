<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGA KEEN - Goldogob</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #171717;
    }

    header {
      background: #111111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 8px;
      color: #cccccc;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin: 20px 0 15px;
    }

    .service {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    .service h3 {
      margin-bottom: 8px;
    }

    .service p {
      color: #666666;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      background: #111111;
      color: white;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      background: #333333;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777777;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>IGA KEEN</h1>
    <p>Taxi • Delivery • Safar</p>
    <p>Goldogob, Soomaaliya</p>
  </header>

  <main class="container">
    <h2>Maxaad u baahan tahay?</h2>

    <section class="service">
      <h3>Taxi</h3>
      <p>Dalbo gaari kuu yimaada meesha aad joogto.</p>
      <button onclick="order('Taxi')">Dalbo Taxi</button>
    </section>

    <section class="service">
      <h3>Delivery</h3>
      <p>Dalbo cunto ama alaab laguu keeno.</p>
      <button onclick="order('Delivery')">Dalbo Delivery</button>
    </section>

    <section class="service">
      <h3>Safar</h3>
      <p>Raadi gaari u socda Gaalkacyo, Garowe iyo meelo kale.</p>
      <button onclick="order('Safar')">Dalbo Safar</button>
    </section>
  </main>

  <footer>
    © 2026 IGA KEEN. Dhammaan xuquuqdu way dhowran tahay.
  </footer>

  <script>
    function order(service) {
      alert(
        "Waxaad dooratay: " + service +
        "\nAdeeggan weli wuxuu u baahan yahay in lagu xiro WhatsApp iyo nidaamka dalabaadka."
      );
    }
  </script>

</body>
</html>
