<!DOCTYPE html>
<html lang="so" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="IGA KEEN — Taxi, Bajaaj, Delivery & Safar. Adeeggaaga meel kasta." />
  <title>IGA KEEN</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- AUTH SCREEN -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-topbar">
      <button class="icon-btn" id="authThemeBtn" onclick="App.toggleTheme()" aria-label="Toggle theme">◐</button>
      <button class="lang-pill" id="authLangBtn" onclick="App.cycleLanguage()">SO</button>
    </div>

    <div class="auth-brand">
      <div class="logo-mark">IG</div>
      <h1>IGA KEEN</h1>
      <p data-i18n="auth.tagline">Adeeggaaga meel kasta.</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tabLogin" onclick="App.authTab('login')" data-i18n="auth.login">Gelid</button>
        <button class="auth-tab" id="tabSignup" onclick="App.authTab('signup')" data-i18n="auth.signup">Diiwaangelin</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="auth-form" onsubmit="App.login(event)">
        <label class="field">
          <span data-i18n="auth.email">Email</span>
          <input type="email" id="loginEmail" autocomplete="email" required placeholder="name@email.com" />
        </label>
        <label class="field">
          <span data-i18n="auth.password">Password</span>
          <input type="password" id="loginPassword" autocomplete="current-password" required minlength="6" placeholder="••••••••" />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn" data-i18n="auth.login">Gelid</button>
        <button type="button" class="link-btn" onclick="App.openForgot()" data-i18n="auth.forgot">Password ma illoowday?</button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="auth-form hidden" onsubmit="App.signup(event)">
        <div class="field">
          <span data-i18n="auth.iam">Macmiil mise Darawal?</span>
          <div class="role-choice" role="radiogroup">
            <label class="role-chip active" id="roleCustomerChip">
              <input type="radio" name="signupRole" value="customer" checked onchange="App.signupRole('customer')" />
              <span data-i18n="role.customer">Macmiil</span>
            </label>
            <label class="role-chip" id="roleDriverChip">
              <input type="radio" name="signupRole" value="driver" onchange="App.signupRole('driver')" />
              <span data-i18n="role.driver">Darawal</span>
            </label>
          </div>
        </div>

        <label class="field">
          <span data-i18n="auth.fullName">Magaca oo buuxa</span>
          <input type="text" id="signupName" autocomplete="name" required placeholder="Magacaaga" />
        </label>
        <label class="field">
          <span data-i18n="auth.phone">Telefoon</span>
          <input type="tel" id="signupPhone" autocomplete="tel" required placeholder="+252 61 000 0000" />
        </label>
        <label class="field">
          <span data-i18n="auth.email">Email</span>
          <input type="email" id="signupEmail" autocomplete="email" required placeholder="name@email.com" />
        </label>
        <label class="field">
          <span data-i18n="auth.password">Password</span>
          <input type="password" id="signupPassword" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
        </label>

        <div id="driverFields" class="hidden">
          <label class="field">
            <span data-i18n="driver.serviceType">Adeegga</span>
            <select id="signupServiceType">
              <option value="taxi">Taxi</option>
              <option value="bajaaj">Bajaaj</option>
              <option value="delivery">Delivery</option>
              <option value="safar">Safar</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="driver.vehicle">Faahfaahinta gaariga</span>
            <input type="text" id="signupVehicle" placeholder="Tusaale: Toyota Vitz — Silver" />
          </label>
          <p class="hint" data-i18n="driver.pendingHint">Darawallada cusub waxaa ansixiya maamulka ka hor inta aanay dalabyo qaadan.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="signupBtn" data-i18n="auth.signup">Diiwaangelin</button>
      </form>
    </div>

    <p class="auth-foot">IGA KEEN · Somali Service Platform</p>
  </section>

  <!-- APP SHELL -->
  <section id="appShell" class="app-shell hidden">
    <header class="app-header" id="appHeader">
      <div class="header-left">
        <div class="logo-mark small">IG</div>
        <div class="header-text">
          <span class="header-kicker" id="headerKicker">IGA KEEN</span>
          <strong id="headerGreeting">Salaam</strong>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notifBtn" onclick="App.navigate('notifications')" aria-label="Notifications">
          <span class="icon">🔔</span>
          <span class="badge hidden" id="notifBadge">0</span>
        </button>
        <button class="avatar-btn" id="avatarBtn" onclick="App.navigate('account')" aria-label="Account">
          <span id="headerAvatar">IG</span>
        </button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation"></nav>
  </section>

  <!-- GLOBAL UI -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
