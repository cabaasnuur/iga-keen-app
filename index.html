<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGA KEEN Taxi</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #171717;
}

header {
  background: #111;
  color: white;
  padding: 28px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 2px;
}

header p {
  color: #ccc;
}

.container {
  max-width: 500px;
  margin: 22px auto;
  padding: 0 16px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #00000010;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 9px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.note {
  color: #666;
  font-size: 13px;
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>IGA KEEN</h1>
  <p>Taxi • Safar • Delivery</p>
  <p>Goldogob, Soomaaliya</p>
</header>

<main class="container">
  <section class="card">
    <h2>Dalbo Taxi</h2>
    <p>Buuxi xogta hoose si aad u dalbato gaari.</p>

    <form id="taxiForm">

      <label for="name">Magacaaga</label>
      <input id="name" type="text"
        placeholder="Geli magacaaga" required>

      <label for="phone">Lambarkaaga telefoonka</label>
      <input id="phone" type="tel"
        placeholder="Geli lambarkaaga" required>

      <label for="pickup">Meesha lagaa qaadayo</label>
      <input id="pickup" type="text"
        placeholder="Tusaale: Suuqa Goldogob" required>

      <label for="destination">Meesha aad u socoto</label>
      <input id="destination" type="text"
        placeholder="Geli meesha aad u socoto" required>

      <label for="time">Goorma ayaad rabtaa Taxi?</label>
      <select id="time" required>
        <option value="">Dooro waqtiga</option>
        <option>Hadda</option>
        <option>30 daqiiqo gudahood</option>
        <option>Waqti dambe</option>
      </select>

      <label for="notes">Faahfaahin dheeraad ah</label>
      <textarea id="notes" rows="3"
        placeholder="Faahfaahin haddii ay jirto"></textarea>

      <button type="submit">
        DALBO TAXI — WHATSAPP
      </button>

      <p class="note">
        Marka aad riixdo badhanka, WhatsApp ayaa furmaya.
        Hubi fariinta kadibna adigu dir.
      </p>

    </form>
  </section>
</main>

<footer>
  © 2026 IGA KEEN — Goldogob
</footer>

<script>
const WHATSAPP_NUMBER = "252907825640";

document.getElementById("taxiForm").addEventListener(
  "submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const pickup = document.getElementById("pickup").value.trim();
    const destination = document.getElementById("destination").value.trim();
    const time = document.getElementById("time").value;
    const notes = document.getElementById("notes").value.trim();

    if (WHATSAPP_NUMBER.includes("X")) {
      alert("Marka hore geli lambarka WhatsApp-ka IGA KEEN ee code-ka ku jira.");
      return;
    }

    const message =
      "IGA KEEN - CODSI TAXI\n\n" +
      "Magaca: " + name + "\n" +
      "Telefoonka: " + phone + "\n" +
      "Meesha laga qaadayo: " + pickup + "\n" +
      "Meesha loo socdo: " + destination + "\n" +
      "Waqtiga: " + time + "\n" +
      "Faahfaahin: " + (notes || "Ma jirto") + "\n\n" +
      "Fadlan ila soo xiriir si loo xaqiijiyo dalabka.";

    const url =
      "https://wa.me/" + WHATSAPP_NUMBER +
      "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  }
);
</script>

</body>
</html>
